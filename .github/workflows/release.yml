# Builds the Lowline installer, signed, and optionally drafts a release with it. Run by hand only.
#
# Signed with the iyulab code signing certificate by Tauri's sign hook (the iyulab/code-sign action's
# code-sign-file.cmd): the app, the sidecar it ships as a resource, its uninstaller and the installer. The installer
# ships the third-party license notices, and the release carries the installer's update signature and the
# update manifest (latest.json) the app reads from the latest release.
# A draft release is visible to maintainers only; publishing it is a separate, manual step.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to build
        default: main
      draft-release:
        description: Create a draft GitHub Release from the installer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    # The code signing certificate is reached through an Azure federated credential bound to this
    # environment; the job's OIDC token carries it.
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: iyulab/lowline-desktop
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - id: version
        shell: pwsh
        run: |
          $v = (Get-Content src/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        working-directory: src
        run: |
          npm ci
          npm test
          npm run test:host
          npm run build:host
          # The notices the installer ships, failing on any package left without its license text.
          npm run notices -- --strict
          cargo test --manifest-path src-tauri/Cargo.toml

      # The app's end-to-end scenarios on this runner, before an installer is made from the source:
      # a sidecar that cannot open its cache, say, only shows once the real app runs.
      - name: End-to-end scenarios
        working-directory: src
        run: |
          npm run build:e2e
          npm run test:e2e

      - name: Build app
        working-directory: src
        env:
          # Compiled into the shell; error reports are sent only when it is set.
          LOWLINE_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.LOWLINE_APPINSIGHTS_CONNECTION_STRING }}
        run: npx tauri build --no-bundle

      # Prepares the job for the sign hook below: code-sign-file.cmd on PATH, which signs one file, and
      # CODE_SIGN_LOG, which every signing appends to. The bundler calls the hook for the programs it packs,
      # the sidecar among its resources too. The action's Azure session lasts about an hour, so it runs
      # right before the bundling.
      - name: Prepare signing
        uses: iyulab/code-sign@c4c68c25295ce0010a396d54cdb017fd248c5cce # main, pinned
        with:
          description: Lowline
          description-url: https://github.com/iyulab/lowline-desktop

      - name: Build installer
        working-directory: src
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # The update signature (.sig) is made over the installer after the sign hook signed it.
          $sign = @{ bundle = @{ createUpdaterArtifacts = $true; windows = @{ signCommand = 'code-sign-file.cmd %1' } } }
          # The cached target folder can hold an earlier run's installers; only this run's may be checked and uploaded.
          Remove-Item -Recurse -Force src-tauri/target/release/bundle -ErrorAction SilentlyContinue
          $config = Join-Path $env:RUNNER_TEMP 'sign.json'
          $sign | ConvertTo-Json -Depth 6 | Set-Content -Path $config -Encoding utf8
          npx tauri bundle --verbose --bundles nsis --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A sign hook keeps a failing command's output to itself: the log holds it.
      - name: Show sign log
        if: failure()
        shell: pwsh
        run: if ($env:CODE_SIGN_LOG -and (Test-Path $env:CODE_SIGN_LOG)) { Get-Content $env:CODE_SIGN_LOG } else { 'nothing was signed' }

      # A signature that is not there is not caught by anything else: Windows still runs the app. The
      # bundler signs the copies of the programs that go into the installer and puts the build output back
      # as it was, so the installed programs are checked under "Check installer"; here, the installer on
      # disk and what the hook signed.
      - name: Check signatures
        working-directory: src
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          $files | ForEach-Object { $sig = Get-AuthenticodeSignature $_.FullName; "{0}: {1} ({2})" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject }
          $bad = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { throw "not signed: $($bad.Name -join ', ')" }
          $signed = @(Select-String -Path $env:CODE_SIGN_LOG -Pattern '^== (.+): signed$' | ForEach-Object { Split-Path -Leaf $_.Matches[0].Groups[1].Value })
          "signed: $($signed -join ', ')"
          foreach ($program in 'lowline.exe', 'Lowline.Host.exe') {
            if ($signed -notcontains $program) { throw "the sign hook never signed $program" }
          }

      # The installer the way a person gets the app: installed for this user, started with its sidecar from
      # the installed folder, closed (taking the sidecar with it), uninstalled. Then the way a person updates:
      # the latest published release installed, its sidecar's caches written, this installer installed over
      # it, and the caches read again. The token lets gh fetch the published installer.
      - name: Check installer
        working-directory: src
        env:
          LOWLINE_EXPECT_SIGNED: '1'
          GH_TOKEN: ${{ github.token }}
        run: npm run check:installer

      - uses: actions/upload-artifact@v7
        with:
          name: lowline-setup
          path: |
            src/src-tauri/target/release/bundle/nsis/*.exe
            src/src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 1

  draft-release:
    if: ${{ inputs.draft-release }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lowline-setup
          path: dist
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: lowline-setup
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # The update manifest the app reads from the latest release: the installer and its update signature.
          exe=$(cd dist && ls *-setup.exe)
          jq -n --arg version "$VERSION" --arg sig "$(cat "dist/$exe.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$exe" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: ("Lowline " + $version), pub_date: $date,
              platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > dist/latest.json
          # A draft of the same version is replaced; a published one is left alone and the step fails.
          if [ "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Lowline $VERSION" --notes "Lowline $VERSION for Windows (x64)."
