# Builds the Lowline installer, signed, and optionally drafts a release with it. Run by hand only.
#
# The build runs here, without any credential. Signing, bundling, the installed copy's signature check, the update
# signature and the draft are iyulab/tauri-release's reusable Windows workflow (pinned to a commit): it signs exactly
# the files in SIGN_BINARIES, bundles twice so the uninstaller and the NSIS plugins are signed too, signs the installer,
# installs it and checks every installed program's signature, signs the installer for the app's updater and writes the
# update manifest (latest.json) the app reads from the latest release, and drafts the release. Only its signing jobs
# hold the signing credential — they are iyulab/code-sign's reusable workflow, which declares this repository's
# `production` environment (the subject of its Azure federated credential) and runs nothing of this repository; the
# updater key reaches its updater job only.
#
#   build (no credential) → previous-draft (a draft of the same version removed) → release: sign-binaries → bundle ×2 → sign-installer → verify → updater → draft
#   → check-installer: installed, started, closed, uninstalled; then installed over the latest published release
#
# A draft release is visible to maintainers only; publishing it is a separate, manual step. A draft whose installer
# fails the install check is deleted again.
#
# Every action is pinned to a commit; the tag it was taken from is in the trailing comment.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to build
        default: main
      draft-release:
        description: Create a draft GitHub Release from the installer
        type: boolean
        default: false

permissions: {}

env:
  # The programs that go into the installer and are signed by us, relative to the source root. The build fails if
  # the built programs are another set — update this list with a deliberate review.
  SIGN_BINARIES: |
    src-tauri/target/release/lowline.exe
    src-host/publish/Lowline.Host.exe

jobs:
  # 1) Test the source and build the app and its sidecar, unsigned. No signing credential here.
  build:
    runs-on: windows-latest        # the app, its sidecar and their end-to-end scenarios are Windows builds
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      pubkey: ${{ steps.version.outputs.pubkey }}
      tauri-cli: ${{ steps.version.outputs.tauri-cli }}
      sign-binaries: ${{ steps.version.outputs.sign-binaries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iyulab/lowline-desktop
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false   # the token is needed only to fetch; later steps must not read it

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # No cache: releases are weeks apart, and GitHub drops a cache not read for seven days.

      - id: version
        shell: pwsh
        run: |
          $conf = Get-Content src/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          "version=$($conf.version)" >> $env:GITHUB_OUTPUT
          "pubkey=$($conf.plugins.updater.pubkey)" >> $env:GITHUB_OUTPUT
          # The bundler and the updater signature use the Tauri CLI the source builds with.
          # A hashtable: the lock file names its root package with an empty key, which an object cannot hold.
          $lock = Get-Content src/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $cli = $lock.packages['node_modules/@tauri-apps/cli'].version
          if (-not $cli) { throw 'package-lock.json has no @tauri-apps/cli' }
          "tauri-cli=@tauri-apps/cli@$cli" >> $env:GITHUB_OUTPUT
          # The reusable workflow is called with `with:`, which cannot read `env` — hand it the list as an output.
          "sign-binaries<<EOF" >> $env:GITHUB_OUTPUT
          @($env:SIGN_BINARIES -split "`n" | ForEach-Object Trim | Where-Object { $_ }) >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Test
        working-directory: src
        run: |
          npm ci
          npm test
          npm run test:host
          npm run build:host
          # The notices the installer ships, failing on any package left without its license text.
          npm run notices -- --strict
          cargo test --manifest-path src-tauri/Cargo.toml

      # The app's end-to-end scenarios on this runner, before an installer is made from the source:
      # a sidecar that cannot open its cache, say, only shows once the real app runs.
      - name: End-to-end scenarios
        working-directory: src
        run: |
          npm run build:e2e
          npm run test:e2e

      - name: Build app
        working-directory: src
        env:
          # Compiled into the shell; error reports are sent only when it is set.
          LOWLINE_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.LOWLINE_APPINSIGHTS_CONNECTION_STRING }}
        run: npx tauri build --no-bundle

      # Hand the signing job exactly the programs to sign, and bundling what it reads: the app's sources (tracked
      # files only), the built app, the published sidecar and the notices.
      - name: Stage for signing and bundling
        shell: pwsh
        run: |
          $src = (Resolve-Path src).Path
          $expected = @($env:SIGN_BINARIES -split "`n" | ForEach-Object Trim | Where-Object { $_ }) | Sort-Object
          $built = @(
            'src-tauri/target/release/lowline.exe'
            Get-ChildItem -Recurse -File src/src-host/publish | Where-Object Extension -in '.exe', '.dll' |
              ForEach-Object { [IO.Path]::GetRelativePath($src, $_.FullName).Replace('\', '/') }
          ) | Sort-Object
          $diff = Compare-Object $expected $built
          if ($diff) { throw "The build made other programs to sign than SIGN_BINARIES:`n$($diff | Out-String)" }

          $unsigned = Join-Path $env:RUNNER_TEMP 'unsigned-binaries'
          foreach ($f in $expected) {
            $to = Join-Path $unsigned $f
            New-Item -ItemType Directory -Force (Split-Path $to) | Out-Null
            Copy-Item (Join-Path $src $f) $to
          }

          $bundleIn = Join-Path $env:RUNNER_TEMP 'bundle-input'
          New-Item -ItemType Directory -Force $bundleIn | Out-Null
          $tar = Join-Path $env:RUNNER_TEMP 'source.tar'
          git -C src archive --format=tar -o $tar HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          tar -xf $tar -C $bundleIn
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          New-Item -ItemType Directory -Force (Join-Path $bundleIn 'src-tauri/target/release'), (Join-Path $bundleIn 'notices/out') | Out-Null
          Copy-Item src/src-tauri/target/release/lowline.exe (Join-Path $bundleIn 'src-tauri/target/release')
          Copy-Item src/src-host/publish (Join-Path $bundleIn 'src-host') -Recurse -Force
          Copy-Item src/notices/out/THIRD-PARTY-NOTICES.txt (Join-Path $bundleIn 'notices/out')

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-binaries
          path: ${{ runner.temp }}/unsigned-binaries
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-input
          path: ${{ runner.temp }}/bundle-input
          if-no-files-found: error
          retention-days: 1

  # A draft of the same version is replaced; a published one is left alone, and the draft job then fails.
  previous-draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - if: ${{ inputs.draft-release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

  # 2) Sign, bundle, check, sign for the updater and draft — tauri-release, with signing in code-sign's jobs only.
  release:
    needs: [build, previous-draft]
    uses: iyulab/tauri-release/.github/workflows/windows.yml@28f0a5f02fe3409e97b2d9f7faab923e2c25faab # main
    permissions:
      id-token: write      # its three signing jobs
      contents: write      # its draft job, only with draft-release
    with:
      unsigned-artifact: unsigned-binaries
      files: ${{ needs.build.outputs.sign-binaries }}
      bundle-artifact: bundle-input
      app-dir: src-tauri
      tauri-cli: ${{ needs.build.outputs.tauri-cli }}
      description: Lowline
      description-url: https://github.com/iyulab/lowline-desktop
      installer-artifact: lowline-setup
      draft: ${{ inputs.draft-release }}
      tag: v${{ needs.build.outputs.version }}
      title: Lowline ${{ needs.build.outputs.version }}
      notes: Lowline ${{ needs.build.outputs.version }} for Windows (x64).
      updater: true
      version: ${{ needs.build.outputs.version }}
      updater-pubkey: ${{ needs.build.outputs.pubkey }}
    secrets:
      updater-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      updater-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # 3) The installer the way a person gets the app: installed for this user, started with its sidecar from the
  # installed folder, closed (taking the sidecar with it), uninstalled. Then the way a person updates: the latest
  # published release installed, its sidecar's caches written, this installer installed over it, and the caches read
  # again. The token lets gh fetch the published installer.
  check-installer:
    needs: [build, release]
    runs-on: windows-latest        # installs and runs the Windows app
    timeout-minutes: 20
    permissions:
      contents: write      # to take back the draft of an installer that failed here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iyulab/lowline-desktop
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lowline-setup
          path: dist
      - name: Check installer
        working-directory: src
        shell: pwsh
        env:
          LOWLINE_EXPECT_SIGNED: '1'
          GH_TOKEN: ${{ github.token }}
          INSTALLER: ${{ needs.release.outputs.installer }}
        run: |
          npm ci
          node scripts/check-installer.mjs (Join-Path $env:GITHUB_WORKSPACE "dist/$env:INSTALLER")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Take back the draft
        if: ${{ failure() && inputs.draft-release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
        shell: bash

  # This run's own artifacts are not kept past it (tauri-release removes its own).
  cleanup:
    if: ${{ always() }}
    needs: [build, previous-draft, release, check-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            unsigned-binaries
            bundle-input
            lowline-setup
          failOnError: false
