# Builds the Lowline installer, signed, and optionally drafts a release with it. Run by hand only.
#
# Signed with the iyulab code signing certificate: the sidecar by the iyulab/code-sign action, then the
# app, its uninstaller and the installer by Tauri's sign hook (scripts/sign-windows.ps1). The installer
# ships the third-party license notices. Not yet part of this pipeline, and required before a release is
# published: update signing and the update manifest (latest.json).
# A draft release is visible to maintainers only; publishing it is a separate, manual step.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to build
        default: main
      draft-release:
        description: Create a draft GitHub Release from the installer
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    # The code signing certificate is reached through an Azure federated credential bound to this
    # environment; the job's OIDC token carries it.
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: iyulab/lowline
          ref: ${{ inputs.ref }}
          path: src
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - id: version
        shell: pwsh
        run: |
          $v = (Get-Content src/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        working-directory: src
        run: |
          npm ci
          npm test
          npm run test:host
          npm run build:host
          cargo test --manifest-path src-tauri/Cargo.toml

      # The app's end-to-end scenarios on this runner, before an installer is made from the source:
      # a sidecar that cannot open its cache, say, only shows once the real app runs.
      - name: End-to-end scenarios
        working-directory: src
        run: |
          npm run build:e2e
          npm run test:e2e

      - name: Build app
        working-directory: src
        env:
          # Compiled into the shell; error reports are sent only when it is set.
          LOWLINE_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.LOWLINE_APPINSIGHTS_CONNECTION_STRING }}
        run: npx tauri build --no-bundle

      # The sidecar goes into the installer as a resource, which Tauri does not sign: sign it in place
      # before bundling. This step also logs the job in to Azure for the sign hook below.
      - name: Sign sidecar
        uses: iyulab/code-sign@693f7261b2e4aef517ff8972db7d07eb53ffc623 # main, pinned
        with:
          files: ${{ github.workspace }}/src/src-host/publish/Lowline.Host.exe

      - name: Build installer
        working-directory: src
        shell: pwsh
        env:
          SIGNED_LOG: ${{ runner.temp }}/signed.txt
        run: |
          $sign = @{ bundle = @{ windows = @{ signCommand = @{
            cmd = 'pwsh'
            args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "$env:GITHUB_WORKSPACE/scripts/sign-windows.ps1", '%1')
          } } } }
          $config = Join-Path $env:RUNNER_TEMP 'sign.json'
          $sign | ConvertTo-Json -Depth 6 | Set-Content -Path $config -Encoding utf8
          npx tauri bundle --bundles nsis --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A signature that is not there is not caught by anything else: Windows still runs the app.
      - name: Check signatures
        working-directory: src
        shell: pwsh
        env:
          SIGNED_LOG: ${{ runner.temp }}/signed.txt
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe) + @(Get-ChildItem src-tauri/target/release/*.exe) + @(Get-Item src-host/publish/Lowline.Host.exe)
          $bad = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          $files | ForEach-Object { $sig = Get-AuthenticodeSignature $_.FullName; "{0}: {1} ({2})" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject }
          if ($bad) { throw "not signed: $($bad.Name -join ', ')" }
          # App, uninstaller and installer go through the sign hook; the uninstaller is only seen there.
          $hooked = @(Get-Content $env:SIGNED_LOG)
          "sign hook: $($hooked -join ', ')"
          if ($hooked.Count -lt 3) { throw "the sign hook signed $($hooked.Count) file(s); expected the app, its uninstaller and the installer" }

      # The installer the way a person gets the app: installed for this user, started with its sidecar from
      # the installed folder, closed (taking the sidecar with it), uninstalled. A fresh runner has no Lowline
      # of its own, so the installed app's real identifier touches nothing.
      - name: Check installer
        working-directory: src
        run: npm run check:installer

      - uses: actions/upload-artifact@v7
        with:
          name: lowline-setup
          path: src/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  draft-release:
    if: ${{ inputs.draft-release }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lowline-setup
          path: dist
      - uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5
        with:
          name: lowline-setup
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # A draft of the same version is replaced; a published one is left alone and the step fails.
          if [ "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Lowline $VERSION" --notes "Lowline $VERSION for Windows (x64)."
